services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    volumes:
      - .:/rails
      - storage:/rails/storage
    env_file:
      - .env
    environment:
      RAILS_ENV: development
      SOLID_QUEUE_IN_PUMA: "true"
    command: bash -c "bin/rails db:prepare && bin/rails server -b 0.0.0.0"

volumes:
  storage: